<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Documents</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0 0 40px; }
    ul.docs { list-style: none; padding: 0; margin: 0; }
    ul.docs li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      transition: border-color .15s ease;
    }
    ul.docs li:hover { border-color: var(--accent); }
    ul.docs a {
      display: block;
      padding: 16px 20px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .empty {
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
    }
    code {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
    }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Shared Documents</h1>
    <p class="sub">HTML documents shared via GitHub Pages.</p>

    <!-- DOCS_LIST_START -->
    <ul class="docs">
      <li><a href="documents/welcome.html">Welcome</a></li>
    </ul>
    <!-- DOCS_LIST_END -->

    <footer>
      Add files to <code>documents/</code> &rarr; reachable at <code>/documents/&lt;name&gt;.html</code>
    </footer>
  </div>
</body>
</html>
